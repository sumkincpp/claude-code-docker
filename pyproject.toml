[project]
name = "ccd"
version = "0.1.3"
description = "Claude Code Docker - A Docker image for running Coding Agents like Claude Code, Gemini, Codex, Copilot and more."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'"
]

[project.scripts]
ccd = "ccd.ccd:main"

[project.entry-points."ccd.backends"]
docker = "ccd.backends.docker:DockerBackend"
buildah = "ccd.backends.buildah:BuildahBackend"
firecracker = "ccd.backends.firecracker:FirecrackerBackend"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length=160

[tool.uv]
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
