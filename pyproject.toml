[project]
name = "ccd"
version = "0.1.3"
description = "Claude Code Docker - A Docker image for running Coding Agents like Claude Code, Gemini, Codex, Copilot and more."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'"
]

[project.scripts]
ccd = "ccd.ccd:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length=160

[tool.uv]
exclude-newer = "1 week"
