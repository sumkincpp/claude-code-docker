[build]
# Backend that builds the image: docker or buildah (default: the [run] backend). Building with another backend than the one that runs
# the image hands it over automatically, e.g. docker or buildah -> firecracker.
backend = "docker"

# Minimum release age in days for npm packages resolved by tag (e.g. latest)
npm_min_release_age_days = 2

# Components exempt from the minimum release age check
npm_min_release_age_ignore_components = ["pi"]

# Components whose npm audit failure should be ignored
npm_audit_ignore_components = []

# Components that run 'npm audit fix --force' before audit checks
npm_audit_force_fix_components = ["pi"]

# Include only these features (mutually exclusive with without_features)
# with_features = ["claude", "codex", "gemini", "opencode", "copilot", "jules", "pi", "rust"]
with_features = ["go", "codex", "claude", "pi", "copilot", "rust"]
#
# Exclude these features
# without_features = []

[versions]
# nvm = "0.40.3"
# node = "22"
# npm = "11.3.0"
# uv = "0.7.2"
# rustup = "1.28.2"
# go = "1.24.0"
# claude = "latest"
# codex = "latest"
# gemini = "latest"
# opencode = "latest"
# copilot = "latest"
# jules = "latest"
# pi = "latest"

# ---------------------------------------------------------------------------
# Run configuration — applied when using `ccd run` or `ccd .`
# CLI flags (--memory, --cpus) override these values.
# ---------------------------------------------------------------------------
[run]

# Runtime backend plugin
backend = "firecracker"

# memory = "4g"
# cpus  = "4"

[[run.mounts]]
host      = "~/.local/share/uv"
container = "/home/user/.local/share/uv"
optional  = true

#[[run.mounts]]
#host      = "~/.gitconfig"
#container = "/home/user/.gitconfig"
#type      = "file"
#optional  = true

#[[run.mounts]]
#host      = "~/.config/git"
#container = "/home/user/.config/git"
#optional  = true

# [[run.mounts]]
# host      = "~/.ssh"
# container = "/home/user/.ssh"
# readonly  = true
# optional  = true

# ---------------------------------------------------------------------------
# Firecracker backend options (used when backend = "firecracker")
# ---------------------------------------------------------------------------
[firecracker]
# Firecracker CI guest kernel (6.1); {arch} becomes x86_64 or aarch64 for the host: ext4, virtio-mmio blk/net, NFSv4 client, overlayfs, user namespaces built in.
# The dated folder rotates. Other kernels: https://spec.ccfc.min.s3.amazonaws.com/?prefix=firecracker-ci/
# (pick the newest folder, then <arch>/vmlinux-*) and https://github.com/firecracker-microvm/firecracker/blob/main/docs/getting-started.md
kernel_url  = "https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/20261023-dd7c24b0d165-0/{arch}/vmlinux-6.1.188"
# cache_dir   = "~/.cache/ccd/firecracker"
# Range for the per-VM /30 networks (default 10.111.111.0/24). Blocks overlapping a route the host already has are skipped;
# avoid 172.17-172.31, which Docker uses for its networks.
# subnet      = "10.111.111.0/24"

# ---------------------------------------------------------------------------
# Buildah backend options (used when backend = "buildah")
# ---------------------------------------------------------------------------
# [buildah]
# Stages built at once (default 4; buildah's own default is 1, 0 = no limit). ccd build --jobs N overrides it for one build.
# jobs = 4

# ---------------------------------------------------------------------------
# Podman backend options (used when backend = "podman")
# ---------------------------------------------------------------------------
# [podman]
# user = "root"   # container root = your host user in rootless podman (mounts are writable); "image" runs the image's own user
