description = "Rust toolchain, installed with rustup"
paths = ["~/.cargo", "~/.rustup"]
order = 15
version = false

[versions]
rustup = "latest"

[install]
command = [
    'if [ "$RUSTUP_VERSION" = latest ]; then unset RUSTUP_VERSION; fi',
    "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -c clippy -c rustfmt",
]

[verify]
command = "rustc --version"
