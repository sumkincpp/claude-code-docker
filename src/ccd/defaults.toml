# Built-in mounts, loaded before ~/.config/ccd/ccd.toml and ./ccd.toml.
# {home} is the host --home folder, a leading ~/ in container is the image user's home.
# Agent names match the build features. Override or add an agent in ccd.toml with [agents.<name>].

[agents.claude]
mounts = [
    { host = "{home}/.claude", container = "~/.claude" },
    { host = "{home}/.claude.json", container = "~/.claude.json", type = "file" },
]

[agents.gemini]
mounts = [{ host = "{home}/.gemini", container = "~/.gemini" }]

[agents.codex]
mounts = [{ host = "{home}/.codex", container = "~/.codex" }]

[agents.copilot]
mounts = [{ host = "{home}/.copilot", container = "~/.copilot" }]

[agents.pi]
mounts = [{ host = "{home}/.pi", container = "~/.pi" }]
